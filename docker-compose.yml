version: '3.8'

services:
  charles:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: charles-ai-v4:latest
    container_name: charles-ai-v4
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - LLM_PROVIDER=groq
    env_file:
      - .env
    volumes:
      # Data persistence (banco SQLite, uploads, memória)
      - ./data:/app/data
      - ./data/uploads:/app/backend/data/uploads
      - ../FQ_DATA_CENTER.xls:/FQ_DATA_CENTER.xls:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.5'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - charles-net
    labels:
      - "com.claro.service=charles"
      - "com.claro.version=4.1.0"

  # Monitor do container (métricas do host)
  guardian-monitor:
    image: prom/node-exporter:latest
    container_name: charles-monitor
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    restart: unless-stopped
    networks:
      - charles-net

networks:
  charles-net:
    driver: bridge

volumes:
  charles-data:
    driver: local