<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Charles, assistente virtual do Departamento de Data Center da Claro Empresas. Consulte SLA, enderecos e procedimentos de acesso.">
  <meta name="theme-color" content="#cc0000">
  <meta name="color-scheme" content="light dark">
  <title>Charles - Assistente Virtual | Departamento de Data Center - Claro Empresas</title>
  
  <!-- Open Graph / Redes Sociais -->
  <meta property="og:title" content="Charles - Assistente Virtual | Departamento de Data Center - Claro Empresas">
  <meta property="og:description" content="Assistente virtual corporativo inteligente para SharePoint">
  <meta property="og:type" content="website">
  
  <!-- Favicon (emoji como fallback) -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
  
  <!-- CSS -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/response-types.css">
  <link rel="stylesheet" href="css/a11y.css">
</head>
<body>
  <!-- Link de pulo: permite ir direto ao campo de pergunta (WCAG 2.4.1) -->
  <a href="#mensagemInput" class="skip-link">Pular para o campo de pergunta</a>

  <div class="app-wrapper">
    
    <!-- ============ TELA INICIAL / VOZ (ROBÔ + MICROFONE) ============ -->
    <div class="voice-screen" id="voiceScreen">
      <div class="voice-content">
        <!-- Robô Charles -->
        <div class="robot-wrapper">
          <div class="robot-glow"></div>
          <img src="assets/charles-removebg-preview.png" class="robot-icon" id="robotIcon" alt="Charles - Assistente Virtual">
          <!-- Indicador de estado (visível mesmo sem animação) -->
          <div class="robot-status" id="robotStatus" role="status" aria-live="polite"></div>
          <!-- Onda sonora (aparece quando escutando) -->
          <div class="sound-waves" id="soundWaves">
            <span></span><span></span><span></span><span></span><span></span>
          </div>

          <!-- Labios para sincronia labial -->
          <div class="mouth" id="mouth">
            <div class="mouth-viseme" id="mouth-viseme-a"></div>
            <div class="mouth-viseme" id="mouth-viseme-e"></div>
            <div class="mouth-viseme" id="mouth-viseme-i"></div>
            <div class="mouth-viseme" id="mouth-viseme-o"></div>
            <div class="mouth-viseme" id="mouth-viseme-u"></div>
            <div class="mouth-viseme" id="mouth-viseme-m"></div>
            <div class="mouth-viseme" id="mouth-viseme-n"></div>
            <div class="mouth-viseme" id="mouth-viseme-l"></div>
            <div class="mouth-viseme" id="mouth-viseme-s"></div>
            <div class="mouth-viseme" id="mouth-viseme-r"></div>
            <div class="mouth-viseme" id="mouth-viseme-ch"></div>
            <div class="mouth-viseme" id="mouth-viseme-g"></div>
            <div class="mouth-viseme" id="mouth-viseme-k"></div>
            <div class="mouth-viseme" id="mouth-viseme-f"></div>
            <div class="mouth-viseme" id="mouth-viseme-v"></div>
            <div class="mouth-viseme" id="mouth-viseme-sh"></div>
            <div class="mouth-viseme" id="mouth-viseme-z"></div>
            <div class="mouth-viseme" id="mouth-viseme-j"></div>
            <div class="mouth-viseme" id="mouth-viseme-lh"></div>
          <!-- Bug corrigido: 'mouth-viseme-t' era referenciado pelo app.js
               mas nunca existiu no HTML, entao a boca ficava travada. -->
          <div class="mouth-viseme" id="mouth-viseme-t"></div>
          </div>
        </div>
        
        <!-- Texto dinâmico -->
        <p class="voice-hint" id="voiceHint">Fale no microfone ou clique em Digitar</p>
        
        <!-- Botões: Microfone + Texto lado a lado -->
        <div class="voice-buttons-row">
          <div class="voice-btn-group">
            <button class="voice-mic-btn" id="voiceMicBtn" aria-label="Falar com o Charles por voz" title="Falar (clique e fale)">
              <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
              </svg>
            </button>
            <span class="voice-btn-label">Falar</span>
          </div>
          <div class="voice-btn-group">
            <button class="voice-text-btn" id="voiceTextBtn" aria-label="Digitar" title="Digitar pergunta">
              <img src="assets/escrever.jpg" alt="Digitar" class="voice-text-icon">
            </button>
            <span class="voice-btn-label">Digitar</span>
          </div>
        </div>
      </div>
    </div>

    <!-- ============ CHAT CONTAINER (aparece após perguntar) ============ -->
    <div class="chat-container" id="chatContainer" style="display: none;">
      
      <!-- HEADER -->
      <header class="chat-header">
        <img src="../assets/Claro-logo.jpg" alt="Logo" class="logo" id="logoEmpresa">
        <div class="header-info">
          <h1>Charles</h1>
          <div class="status" role="status" aria-live="polite">
            <span class="dot" id="statusDot"></span>
            <span id="statusText">Conectando...</span>
          </div>
        </div>
        <button class="back-to-voice" id="backToVoiceBtn" title="Voltar ao início">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>
            <path d="M14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
          </svg>
        </button>
      </header>
      
      <!-- ARIA DE MENSAGENS -->
      <div class="chat-messages" id="chatMessages" role="log" aria-live="polite" aria-relevant="additions" aria-atomic="false" aria-label="Conversa com o Charles">
        <!-- Mensagem de boas-vindas será inserida via JS -->
      </div>
      
      <!-- INPUT -->
      <div class="chat-input">
        <input 
          type="text" 
          id="mensagemInput" 
          placeholder="Digite sua pergunta..." 
          autocomplete="off"
          aria-label="Digite sua mensagem"
        >
        <button id="microfoneBtn" class="voice-btn" aria-label="Falar" title="Falar (clique e fale)">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
            <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
          </svg>
        </button>
        <button id="enviarBtn" aria-label="Enviar mensagem" title="Enviar">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
          </svg>
        </button>
        <button id="somBtn" class="voice-btn" aria-label="Ler resposta em voz alta" title="Ler resposta">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>
            <path d="M14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
          </svg>
        </button>
        <button id="stopSpeechBtn" class="voice-btn stop-speech-btn" aria-label="Parar fala" title="Parar fala" disabled>
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M6 6h12v12H6z"/>
          </svg>
        </button>
      </div>
      
      <!-- FOOTER -->
      <footer class="chat-footer">
        <span>© 2026 Departamento de Data Center - Claro Empresas | <a href="#" onclick="return false;">SharePoint</a></span>
      </footer>
    </div>
    
  </div>
  
  <!-- JAVASCRIPT -->
  <script src="js/api-client.js"></script>
  <script src="js/voice-client.js"></script>
  <script src="js/lip-sync.js"></script>
  <script src="js/voice.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
