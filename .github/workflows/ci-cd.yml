# ============================================================
# CI/CD - Charles AI v4
# Pipeline: Lint -> Test -> Build Docker -> Publish
# ============================================================

name: CI/CD Charles AI v4

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  # ============ JOB 1: TESTES ============
  test:
    name: 🧪 Testes Automatizados
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        # better-sqlite3@13 e openai@7 exigem node >=22 (engines).
        # Node 18/20 davam SIGSEGV nos testes (EBADENGINE no npm ci).
        node-version: [22.x, 24.x]

    steps:
      - name: 📥 Checkout do código
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: 📦 Instalar dependências
        run: npm ci --prefix backend

      - name: 🧪 Rodar testes (com coverage)
        run: npm run test:ci --prefix backend
        env:
          NODE_ENV: test

      - name: 📊 Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-node${{ matrix.node-version }}
          path: coverage/
          retention-days: 7
          if-no-files-found: warn

  # ============ JOB 2: VERIFICAÇÃO DE SEGURANÇA ============
  security:
    name: 🛡️ Segurança e Guardiões
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout do código
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: 📦 Instalar dependências
        run: npm ci --prefix backend

      - name: 🔒 Verificar vulnerabilidades de dependências
        run: npm audit --prefix backend --audit-level=high || echo "⚠️ Vulnerabilidades altas encontradas (não bloqueante)"

      - name: 🛡️ Rodar guardiões do sistema
        run: npm run guardians:check --prefix backend || echo "⚠️ Guardiões reportaram problemas"

  # ============ JOB 3: BUILD DOCKER ============
  docker-build:
    name: 🐳 Build Docker
    runs-on: ubuntu-latest
    needs: [test, security]
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout do código
        uses: actions/checkout@v4

      - name: 🐳 Build da imagem Docker
        run: |
          docker build \
            --target runtime \
            --tag charles-ai-v4:${GITHUB_SHA::7} \
            --tag charles-ai-v4:latest \
            .

      - name: 🐳 Validar imagem (healthcheck)
        run: |
          docker run -d --name charles-test -p 3000:3000 charles-ai-v4:${GITHUB_SHA::7}
          sleep 10
          echo "--- docker ps -a ---"
          docker ps -a | grep charles-test || true
          echo "--- logs do container (últimas 60 linhas) ---"
          docker logs charles-test 2>&1 | tail -60 || true
          echo "--- estado ---"
          docker inspect --format='running={{.State.Running}} exitcode={{.State.ExitCode}} health={{.State.Health.Status}}' charles-test
          # O container precisa estar de pé (o healthcheck do Dockerfile cuida do resto)
          test "$(docker inspect --format='{{.State.Running}}' charles-test)" = "true"
          docker stop charles-test
          docker rm charles-test

  # ============ JOB 4: DEPLOY (apenas main/master) ============
  deploy:
    name: 🚀 Deploy Produção
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    environment: production
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout do código
        uses: actions/checkout@v4

      - name: 🚀 Deploy via SSH (comando de exemplo)
        run: |
          echo "=============================================="
          echo "DEPLOY DE PRODUÇÃO"
          echo "=============================================="
          echo "Para habilitar o deploy real, configure o secret SERVER_HOST, SERVER_USER, SSH_PRIVATE_KEY"
          echo "e adicione o comando docker-compose correspondente."
          echo ""
          echo "Exemplo de deploy em servidor remoto:"
          echo "  ssh user@server 'cd /app && docker-compose pull && docker-compose up -d'"
          echo "=============================================="
        env:
          # Secrets necessários (configurar no GitHub):
          # SERVER_HOST, SERVER_USER, SSH_PRIVATE_KEY
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}