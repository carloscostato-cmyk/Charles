# ============================================================
# Deploy Charles - Fase 1 (corrigido)
# - Dispara em main E master (o repo usa master; antes so
#   escutava "main" e este workflow NUNCA rodava)
# - guardians:check agora roda com --prefix backend (antes
#   rodava na raiz onde package.json nao tem "scripts")
# - actions v4 + Node 20 (alinhado ao ci-cd.yml)
# ============================================================

name: Deploy Charles v3.0

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  # ============ VALIDAÇÃO PRÉ-DEPLOY ============
  validate:
    name: 🧪 Validação pré-deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependências
        run: npm ci --prefix backend

      - name: 🧪 Rodar testes
        run: npm run test:ci --prefix backend
        env:
          NODE_ENV: test

      - name: 🛡️ Verificar guardiões
        run: npm run guardians:check --prefix backend

      - name: 📤 Upload cobertura (não bloqueante)
        uses: codecov/codecov-action@v3
        continue-on-error: true
        with:
          files: ./coverage/coverage-final.json
          flags: unittests

  # ============ DEPLOY ============
  # (Fase 3 do Famps concluída: o job de publicação no GitHub
  #  Pages está logo abaixo — "pages", com needs: validate)
  deploy:
    name: ✅ Deploy bem-sucedido
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: ✅ Confirmar deploy
        run: |
          echo "✅ Charles pronto para deploy!"
          echo "Versão: 3.0.0"
          echo "Branch: ${GITHUB_REF_NAME}"
          echo "Commit: ${GITHUB_SHA::7}"
          echo "Data: $(date)"

  # ============ FASE 3 FAMPS: PUBLICAÇÃO NO GITHUB PAGES ============
  # Monta o pacote estático (index com paths relativos + mock injetado
  # + 159 FAQs embutidas) e publica via upload-pages-artifact +
  # deploy-pages. Só roda em push de main/master (nunca em PR) e
  # apenas após validate (testes + guardiões) — needs: validate.
  # Repo Pages deve estar com Source = "GitHub Actions" (build_type:
  # workflow, habilitado via API na ativação da Fase 3).
  pages:
    name: 🌐 Deploy GitHub Pages (demo estático)
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 15
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependências (xlsx p/ leitura da FAQ)
        run: npm ci --prefix backend

      - name: 📦 Gerar pacote Pages (159 FAQs embutidas)
        run: node scripts/build-pages-site.js

      - name: ⚙️ Configurar Pages
        uses: actions/configure-pages@v6

      - name: 📤 Upload do artifact (pages-site)
        uses: actions/upload-pages-artifact@v5
        with:
          path: pages-site
          include-hidden-files: true

      - name: 🌐 Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: 🔍 Smoke test no site publicado
        run: |
          URL="${{ steps.deployment.outputs.page_url }}"
          echo "Verificando $URL"
          ok=0
          for i in $(seq 1 12); do
            code=$(curl -sS -o /tmp/pages.html -w '%{http_code}' "$URL" || echo 000)
            if [ "$code" = "200" ] && grep -q "__CHARLES_PAGES__" /tmp/pages.html; then
              ok=1
              break
            fi
            echo "tentativa $i/12: index=$code — aguardando propagação do Pages..."
            sleep 10
          done
          if [ "$ok" != "1" ]; then
            echo "❌ index não respondeu 200 com o mock injetado"
            exit 1
          fi
          fcode=$(curl -sS -o /tmp/faqs.js -w '%{http_code}' "${URL%/}/data/faqs.js" || echo 000)
          if [ "$fcode" != "200" ] || ! grep -q "CHARLES_FAQS" /tmp/faqs.js; then
            echo "❌ data/faqs.js inacessível (code=$fcode)"
            exit 1
          fi
          n=$(grep -o '"id":' /tmp/faqs.js | wc -l | tr -d ' ')
          echo "FAQs embutidas no ar: $n"
          if [ "$n" != "159" ]; then
            echo "❌ esperado 159 FAQs publicadas, encontrado $n"
            exit 1
          fi
          echo "✅ Pages no ar: $URL"
